<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - Vehicles</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <link rel="stylesheet" href="../../assets/css/components/ai-widget.css" />
</head>

<body>
  <div class="app-shell" data-page="vehicles">
    <header class="app-topbar">
      <a class="app-brand" href="./vehicles.html" aria-label="Auto Ultimate home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15.5 15.5 4H20v4.5L8.5 20H4v-4.5Z"></path>
          </svg>
        </span>
        <span class="brand-text"><span>AUTO</span><span>ULTIMATE</span></span>
      </a>
      <button class="icon-button filter-toggle" type="button" data-filter-toggle aria-label="Open filters">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 6h16"></path>
          <path d="M7 12h10"></path>
          <path d="M10 18h4"></path>
        </svg>
      </button>
    </header>

    <aside class="customer-nav" aria-label="Customer navigation">
      <a class="nav-item active" href="./vehicles.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 17h14l-1.3-5.2A3 3 0 0 0 14.8 9H9.2a3 3 0 0 0-2.9 2.8L5 17Z"></path>
          <path d="M7 17v2"></path>
          <path d="M17 17v2"></path>
          <path d="M8 13h8"></path>
        </svg>
        <span>Vehicles</span>
      </a>
      <a class="nav-item" href="./bookings.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="4" width="14" height="16" rx="2"></rect>
          <path d="M9 8h6"></path>
          <path d="M9 12h6"></path>
          <path d="M9 16h4"></path>
        </svg>
        <span>Bookings</span>
      </a>
      <a class="nav-item" href="./favourites.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20.8 8.6a5.5 5.5 0 0 0-9.1-3.9L12 5l.3-.3a5.5 5.5 0 0 1 7.8 7.8L12 20.5l-8.1-8a5.5 5.5 0 0 1 7.8-7.8L12 5">
          </path>
        </svg>
        <span>Favourites</span>
      </a>
      <a class="nav-item" href="./profile.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
      <button class="nav-item nav-button" type="button" data-logout>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17 15 12l-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 3v18"></path>
        </svg>
        <span>Logout</span>
      </button>
    </aside>

    <main class="vehicles-page">
      <form class="filter-panel" data-filter-form aria-label="Vehicle filters">
        <div class="filter-head">
          <h2>Filter by</h2>
          <button type="reset">Reset all</button>
        </div>

        <label class="filter-search" for="vehicle-search">
          <span>Search</span>
          <input id="vehicle-search" name="search" type="search" placeholder="Brand or model" autocomplete="off" />
        </label>

        <section class="filter-group">
          <div class="filter-row">
            <span class="filter-label">Available now only</span>
            <label class="switch">
              <input name="status" type="checkbox" value="available" checked />
              <span></span>
            </label>
          </div>
        </section>

        <section class="filter-group">
          <div class="filter-label">Price range / day</div>
          <div class="range-grid">
            <label>From <input name="min_price" type="number" min="0" placeholder="$0" /></label>
            <label>To <input name="max_price" type="number" min="0" placeholder="$250" /></label>
          </div>
        </section>

        <section class="filter-group">
          <label class="select-label" for="category">Body type</label>
          <select id="category" name="category">
            <option value="">Any body type</option>
            <option value="sedan">Sedan</option>
            <option value="suv">SUV</option>
            <option value="coupe">Coupe</option>
            <option value="hatchback">Hatchback</option>
            <option value="van">Van</option>
            <option value="pickup">Pickup</option>
            <option value="crossover">Crossover</option>
          </select>
        </section>

        <section class="filter-group">
          <label class="select-label" for="seats">Seats</label>
          <select id="seats" name="seats">
            <option value="">Any seats</option>
            <option value="2">2 seats</option>
            <option value="4">4 seats</option>
            <option value="5">5 seats</option>
            <option value="7">7 seats</option>
            <option value="8">8+ seats</option>
          </select>
        </section>

        <section class="filter-group">
          <div class="filter-label">Transmission</div>
          <div class="segmented compact">
            <input type="radio" name="transmission" id="trans-any" value="" checked />
            <label for="trans-any">Any</label>
            <input type="radio" name="transmission" id="trans-auto" value="auto" />
            <label for="trans-auto">Automatic</label>
            <input type="radio" name="transmission" id="trans-manual" value="manual" />
            <label for="trans-manual">Manual</label>
          </div>
        </section>
      </form>

      <section class="vehicles-content" aria-live="polite">
        <div class="content-head">
          <div>
            <p class="eyebrow">Available fleet</p>
            <h1><span data-total-count>0</span> vehicles to rent</h1>
          </div>
          <div class="sort-pill">
            <span>Sort</span>
            <select data-sort>
              <option value="newest">Newest</option>
              <option value="price_asc">Price low</option>
              <option value="price_desc">Price high</option>
              <option value="rating">Top rated</option>
            </select>
          </div>
        </div>

        <div class="vehicle-grid" data-vehicle-grid></div>
        <div class="empty-state" data-empty-state hidden>
          <h2>No vehicles found</h2>
          <p>Try clearing a filter or widening your price range.</p>
        </div>
        <div class="pagination-row" data-pagination></div>
      </section>
    </main>
  </div>

  <script src="../../assets/js/api.js" defer></script>
  <script src="../../assets/js/state.js" defer></script>
  <script src="../../assets/js/utils.js" defer></script>
  <script src="../../js/pages/vehicles.js" defer></script>
  <script src="../../assets/js/components/aiChat.js" defer></script>
</body>

</html>
