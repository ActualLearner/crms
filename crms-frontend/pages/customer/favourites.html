<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - Favourites</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <style>
    .favourites-sort select {
      width: auto;
      padding-right: 32px;
    }
  </style>
</head>

<body>
  <div class="app-shell" data-page="favourites">
    <header class="app-topbar">
      <a class="app-brand" href="./vehicles.html" aria-label="Auto Ultimate home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15.5 15.5 4H20v4.5L8.5 20H4v-4.5Z"></path>
          </svg>
        </span>
        <span class="brand-text"><span>AUTO</span><span>ULTIMATE</span></span>
      </a>
    </header>

    <aside class="customer-nav" aria-label="Customer navigation">
      <a class="nav-item" href="./vehicles.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 17h14l-1.3-5.2A3 3 0 0 0 14.8 9H9.2a3 3 0 0 0-2.9 2.8L5 17Z"></path>
          <path d="M7 17v2"></path>
          <path d="M17 17v2"></path>
          <path d="M8 13h8"></path>
        </svg>
        <span>Vehicles</span>
      </a>
      <a class="nav-item" href="./bookings.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="4" width="14" height="16" rx="2"></rect>
          <path d="M9 8h6"></path>
          <path d="M9 12h6"></path>
          <path d="M9 16h4"></path>
        </svg>
        <span>Bookings</span>
      </a>
      <a class="nav-item active" href="./favourites.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z">
          </path>
        </svg>
        <span>Favourites</span>
      </a>
      <a class="nav-item" href="./profile.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
      <button class="nav-item nav-button" type="button" data-logout>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17 15 12l-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 3v18"></path>
        </svg>
        <span>Sign out</span>
      </button>
    </aside>

    <main class="favourites-page">
      <section class="favourites-head">
        <div>
          <h1>Favourites</h1>
          <p>Cars you've saved for later</p>
        </div>
        <label class="favourites-sort">Sort by
          <select data-sort>
            <option value="recent">Recently saved</option>
            <option value="price_asc">Price low</option>
            <option value="price_desc">Price high</option>
            <option value="rating">Top rated</option>
          </select>
        </label>
      </section>

      <nav class="favourite-filters" aria-label="Favourite filters">
        <button class="active" type="button" data-filter="all">All</button>
        <button type="button" data-filter="sedan">Sedan</button>
        <button type="button" data-filter="suv">SUV</button>
        <button type="button" data-filter="hatchback">Hatchback</button>
        <button type="button" data-filter="available">Available now</button>
      </nav>

      <p class="saved-count"><strong data-count>0</strong> saved cars</p>
      <section class="favourites-grid" data-favourites-grid aria-live="polite"></section>
      <div class="empty-state favourites-empty" data-empty-state hidden>
        <h2>No saved cars</h2>
        <p>Save cars from the fleet and they will appear here.</p>
        <a class="btn-secondary" href="./vehicles.html">Browse vehicles</a>
      </div>
    </main>
  </div>

  <script src="../../assets/js/api.js" defer></script>
  <script src="../../assets/js/state.js" defer></script>
  <script src="../../assets/js/utils.js" defer></script>
  <script src="../../js/pages/favourites.js" defer></script>
</body>

</html>
