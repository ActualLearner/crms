<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - My Bookings</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
</head>

<body>
  <div class="app-shell" data-page="bookings">
    <header class="app-topbar">
      <a class="app-brand" href="./vehicles.html" aria-label="Auto Ultimate home">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15.5 15.5 4H20v4.5L8.5 20H4v-4.5Z"></path>
          </svg>
        </span>
        <span class="brand-text"><span>AUTO</span><span>ULTIMATE</span></span>
      </a>
    </header>

    <aside class="customer-nav" aria-label="Customer navigation">
      <a class="nav-item" href="./vehicles.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 17h14l-1.3-5.2A3 3 0 0 0 14.8 9H9.2a3 3 0 0 0-2.9 2.8L5 17Z"></path>
          <path d="M7 17v2"></path>
          <path d="M17 17v2"></path>
          <path d="M8 13h8"></path>
        </svg>
        <span>Vehicles</span>
      </a>
      <a class="nav-item active" href="./bookings.html" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="4" width="14" height="16" rx="2"></rect>
          <path d="M9 8h6"></path>
          <path d="M9 12h6"></path>
          <path d="M9 16h4"></path>
        </svg>
        <span>Bookings</span>
      </a>
      <a class="nav-item" href="./favourites.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z">
          </path>
        </svg>
        <span>Favourites</span>
      </a>
      <a class="nav-item" href="./waitlist-notifications.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 7h18s-3 0-3-7"></path>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"></path>
        </svg>
        <span>Waitlist</span>
      </a>
      <a class="nav-item" href="./profile.html">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21a8 8 0 0 0-16 0"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </a>
      <button class="nav-item nav-button" type="button" data-logout>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17 15 12l-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M21 3v18"></path>
        </svg>
        <span>Sign out</span>
      </button>
    </aside>


    <main class="bookings-page">
      <section class="bookings-head">
        <div>
          <h1>My bookings</h1>
          <p>All your rentals in one place</p>
        </div>
        <a class="btn-secondary new-booking-button" href="./vehicles.html">+ New booking</a>
      </section>

      <section class="booking-stats" aria-label="Booking stats">
        <article><span>Total</span><strong data-stat-total>0</strong>
          <p>all time</p>
        </article>
        <article><span>Active</span><strong data-stat-active>0</strong>
          <p>in progress</p>
        </article>
        <article><span>Upcoming</span><strong data-stat-upcoming>0</strong>
          <p>confirmed + pending</p>
        </article>
        <article><span>Spent</span><strong data-stat-spent>$0</strong>
          <p>lifetime</p>
        </article>
      </section>

      <nav class="booking-tabs" aria-label="Booking filters">
        <button class="active" type="button" data-filter="all">All</button>
        <button type="button" data-filter="upcoming">Upcoming</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
        <button type="button" data-filter="cancelled">Cancelled</button>
      </nav>

      <section class="booking-list" data-booking-list aria-live="polite"></section>
      <div class="empty-state bookings-empty" data-empty-state hidden>
        <h2>No bookings here</h2>
        <p>Try another filter or reserve a vehicle from the fleet.</p>
      </div>
      <div class="pagination-row" data-pagination></div>
    </main>
  </div>

  <script src="../../assets/js/api.js" defer></script>
  <script src="../../assets/js/state.js" defer></script>
  <script src="../../assets/js/utils.js" defer></script>
  <script src="../../js/pages/bookings.js" defer></script>
</body>

</html>
