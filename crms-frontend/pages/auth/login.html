<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - Login</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
	<link rel="stylesheet" href="../../assets/css/components/buttons.css" />
	<link rel="stylesheet" href="../../assets/css/components/skeleton.css" />
	<link rel="stylesheet" href="../../assets/css/components/buttons.css" />
	<link rel="stylesheet" href="../../assets/css/components/skeleton.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="card fade-up-soft" aria-label="Sign in form">
      <header class="card-header">
        <div class="brand-row">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"></path>
              <path d="m12 5 7 7-7 7"></path>
            </svg>
          </div>
          <div class="brand-text" aria-label="Auto Ultimate brand">
            <span>AUTO</span>
            <span>ULTIMATE</span>
          </div>
        </div>
        <h1 class="headline">Welcome back</h1>
        <p class="subhead">Sign in to your account to continue</p>
      </header>

      <div class="card-body">
        <nav class="segmented" aria-label="Authentication tabs">
          <span class="seg-item active" aria-current="page">Sign in</span>
          <a class="seg-item" href="./register.html">Create account</a>
        </nav>

        <form class="auth-form" action="#" method="post" novalidate>
          <div class="field">
            <label class="field-label" for="email">Email address</label>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="m3 7 9 6 9-6"></path>
              </svg>
              <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />
            </div>
          </div>

          <div class="field">
            <div class="field-row">
              <label class="field-label" for="password">Password</label>
              <a class="field-link" href="#">Forgot password?</a>
            </div>
            <div class="input-shell">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="5" y="11" width="14" height="10" rx="2"></rect>
                <path d="M8 11V8a4 4 0 1 1 8 0v3"></path>
              </svg>
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
              <button
                class="input-tail password-toggle"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                data-password-toggle
                data-target="password"
              >
                <svg class="input-icon password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path class="password-toggle-visible" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                  <circle class="password-toggle-visible" cx="12" cy="12" r="3"></circle>
                  <path class="password-toggle-hidden" d="M3 3l18 18"></path>
                  <path class="password-toggle-hidden" d="M10.6 10.6a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <label class="remember" for="remember">
            <input id="remember" name="remember" type="checkbox" />
            <span>Remember me for 30 days</span>
          </label>

          <button class="btn-primary" type="submit">Sign in</button>
        </form>

        <p class="auth-footnote">Don't have an account? <a href="./register.html"><strong>Sign up free</strong></a></p>
      </div>
    </section>
  </main>
  <script src="../../assets/js/api.js" defer></script>
  <script src="../../assets/js/state.js" defer></script>
  <script src="../../assets/js/utils.js" defer></script>
  <script src="../../assets/js/auth-guard.js" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => window.AuthGuard?.redirectAuthenticatedUser());
  </script>
  <script src="../../js/pages/auth.js" defer></script>
</body>
</html>
