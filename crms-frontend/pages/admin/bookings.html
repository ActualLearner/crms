<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - Admin Bookings</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
</head>
<body>
  <div class="admin-shell" data-page="bookings">
    <header class="admin-topbar">
      <a class="admin-brand" href="./dashboard.html"><span class="admin-brand-mark"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span><span class="admin-brand-text">Auto<br>Ultimate</span></a>
      <span class="admin-section-label">Admin</span>
      <nav class="admin-nav" data-admin-nav aria-label="Admin navigation"></nav>
      <div class="admin-topbar-actions"><button class="admin-icon-btn" data-admin-menu type="button" aria-label="Toggle navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><button class="admin-btn" data-logout type="button">Logout</button><span class="admin-avatar">AD</span></div>
    </header>
    <main class="admin-page">
      <div class="admin-page-header">
        <div><h1>All bookings</h1><p>Manage, confirm and log returns</p></div>
        <button class="admin-btn primary" type="button" data-export-bookings>Export CSV</button>
      </div>
      <section class="admin-stats-grid">
        <article class="admin-stat-card"><span>Total bookings</span><strong id="bookings-total">0</strong></article>
        <article class="admin-stat-card"><span>Pending</span><strong id="bookings-pending">0</strong></article>
        <article class="admin-stat-card"><span>Active</span><strong id="bookings-active">0</strong></article>
        <article class="admin-stat-card"><span>Returned</span><strong id="bookings-returned">0</strong></article>
      </section>
      <section class="admin-filters">
        <div class="admin-segmented" data-booking-tabs>
          <button class="admin-chip active" data-status="all">All</button>
          <button class="admin-chip" data-status="pending">Pending</button>
          <button class="admin-chip" data-status="active">Active</button>
          <button class="admin-chip" data-status="completed">Returned</button>
          <button class="admin-chip" data-status="cancelled">Cancelled</button>
        </div>
        <input id="booking-search" class="admin-input" type="search" placeholder="Search customer or car..." />
      </section>
      <section class="admin-panel">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead><tr><th>Ref</th><th>Customer</th><th>Vehicle</th><th>Pick-up</th><th>Return</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="bookings-table"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <dialog class="admin-modal" id="return-modal">
    <form method="dialog" id="return-form">
      <div class="admin-modal-header"><h2>Log vehicle return</h2><button class="admin-btn" value="cancel" type="button" data-close-return>Close</button></div>
      <div class="admin-modal-body">
        <div class="return-stepper"><div class="return-step active"><span>1</span><span>Return details</span></div><div class="return-step"><span>2</span><span>Damage report</span></div><div class="return-step"><span>3</span><span>Confirm</span></div></div>
        <div id="return-summary" class="alert"></div>
        <div class="form-grid">
          <div class="field"><label for="actual-return-date">Actual return date</label><input id="actual-return-date" name="actual_return_date" class="admin-input" type="date" required /></div>
          <div class="field"><label for="return-condition">Condition</label><select id="return-condition" name="condition" class="admin-select"><option value="excellent">Excellent</option><option value="good">Good</option><option value="damaged">Damaged</option></select></div>
          <div class="field full" data-damage-field hidden><label for="damage-description">Damage description</label><textarea id="damage-description" name="damage_description" class="admin-textarea" placeholder="Describe location, type, and severity"></textarea></div>
          <div class="field" data-damage-field hidden><label for="repair-cost">Estimated repair cost</label><input id="repair-cost" name="repair_cost" class="admin-input" type="number" min="0" step="0.01" value="0" /></div>
        </div>
      </div>
      <div class="admin-modal-actions"><button class="admin-btn" type="button" data-close-return>Back</button><button class="admin-btn primary" type="submit">Confirm return</button></div>
    </form>
  </dialog>
  <script src="../../assets/js/api.js"></script>
  <script src="../../js/pages/admin-common.js"></script>
  <script src="../../js/pages/admin-bookings.js"></script>
</body>
</html>
