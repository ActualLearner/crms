<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMS - Admin Fleet Management</title>
  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/reset.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/animations.css" />
  <link rel="stylesheet" href="../../assets/css/layout.css" />
  <link rel="stylesheet" href="../../assets/css/components/admin-fleet.css" />
</head>
<body class="surface-b-base text-t-primary">
  <div class="app-shell nav-open" data-page="fleet">

    <!-- ── Topbar ── -->
    <header class="app-topbar">
      <a class="app-brand" href="./dashboard.html" aria-label="Auto Ultimate home">
        <span class="brand-icon" aria-hidden="true"
              style="background:#0a0a0a;color:#fff;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </span>
        <span class="brand-text"><span>AUTO</span><span>ULTIMATE</span></span>
      </a>

      <nav class="topbar-links" style="display:flex;gap:24px;margin-left:24px;align-items:center;">
        <a href="#" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z" fill="currentColor"/></svg>
          <span>Admin</span>
        </a>
        <span class="nav-divider"></span>
        <a href="./dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="./bookings.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 8h6" stroke="currentColor" stroke-width="1.5"/><path d="M9 12h6" stroke="currentColor" stroke-width="1.5"/><path d="M9 16h4" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Bookings</span>
        </a>
        <a href="./fleet.html" class="nav-link active" style="background:#0a0a0a;color:#fff;padding:6px 16px;border-radius:8px;">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><path d="M5 17h14l-1.3-5.2A3 3 0 0 0 14.8 9H9.2a3 3 0 0 0-2.9 2.8L5 17Z" fill="currentColor"/><path d="M7 17v2" stroke="currentColor" stroke-width="1.5"/><path d="M17 17v2" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Fleet</span>
        </a>
        <a href="./customers.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><path d="M20 21a8 8 0 0 0-16 0" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Customers</span>
        </a>
        <a href="./promos.html" class="nav-link">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="nav-icon"><path d="M7 7h10v10H7z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M3 21l18-18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Promo</span>
        </a>
      </nav>
      
      <button id="nav-toggle" class="icon-button nav-toggle" type="button" aria-label="Toggle navigation" style="display:none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
        </svg>
      </button>

      <div class="topbar-user" style="margin-left:auto;display:flex;gap:16px;align-items:center;">
        <button id="filter-toggle" class="icon-button filter-toggle" type="button" aria-label="Open filters" style="display:none;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h16"></path>
            <path d="M7 12h10"></path>
            <path d="M10 18h4"></path>
          </svg>
        </button>
        <button data-logout style="font-weight:600;color:var(--text-secondary);cursor:pointer;border:none;background:transparent;padding:0;">Logout</button>
        <div class="topbar-user-circle">AD</div>
      </div>
    </header>

    <!-- ── Main ── -->
    <main class="fleet-page">

      <!-- Page header -->
      <div class="page-header">
        <div>
          <h1>Fleet management</h1>
          <p class="subtitle"><span id="stat-total-head">0</span> vehicles total</p>
        </div>
        <button id="add-vehicle-btn" class="btn-add-vehicle">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2.5">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Add vehicle
        </button>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total fleet</h3>
          <p id="stat-total">0</p>
        </div>
        <div class="stat-card">
          <h3>Available</h3>
          <p id="stat-available" class="text-success">0</p>
        </div>
        <div class="stat-card">
          <h3>Rented</h3>
          <p id="stat-rented">0</p>
        </div>
        <div class="stat-card">
          <h3>Maintenance</h3>
          <p id="stat-maintenance" class="text-warning">0</p>
        </div>
      </div>

      <!-- Filters bar -->
      <div class="filters-bar">
        <div class="segmented compact">
          <input type="radio" id="f-all"   name="fleet_status" value="all"         checked>
          <label for="f-all">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filter-icon"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg>
            <span>All</span>
          </label>

          <input type="radio" id="f-avail" name="fleet_status" value="available">
          <label for="f-avail">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filter-icon"><path d="M20 6L9 17l-5-5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Available</span>
          </label>

          <input type="radio" id="f-rent"  name="fleet_status" value="rented">
          <label for="f-rent">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filter-icon"><path d="M5 17h14l-1.3-5.2A3 3 0 0 0 14.8 9H9.2a3 3 0 0 0-2.9 2.8L5 17Z" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M7 17v2" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/><path d="M17 17v2" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Rented</span>
          </label>

          <input type="radio" id="f-maint" name="fleet_status" value="maintenance">
          <label for="f-maint">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="filter-icon"><path d="M12 2L6 6v8h12V6l-6-4z" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 13l2 2 4-4" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Maintenance</span>
          </label>
        </div>

        <input type="text" id="search-input" class="search-input"
               placeholder="Search make, model…" />
      </div>

      <!-- Fleet grid -->
      <div id="fleet-grid">
        <!-- populated by JS -->
      </div>

    </main>
  </div>

  <!-- ── Add Vehicle Modal ── -->
  <dialog id="add-vehicle-modal">
    <div class="modal-header">
      <h2 id="vehicle-modal-title">Add vehicle</h2>
      <button type="button" id="close-modal-btn" class="modal-close-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form id="add-vehicle-form">
      <input type="hidden" id="vehicle-id" name="id" value="" />


      <!-- Image upload -->
      <div class="form-group">
        <label class="form-label">Vehicle image</label>
        <div class="upload-area">
          <div id="image-preview-area" style="display:none;">
            <img id="image-preview" class="upload-preview" />
            <button type="button" id="change-image-btn" class="btn-change-image">Change image</button>
          </div>
          <div id="image-upload-prompt" class="upload-prompt">
            <svg viewBox="0 0 24 24" width="28" height="28" stroke="var(--text-muted)" fill="none" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="upload-prompt-title">Click to upload or drag and drop</span>
            <span class="upload-prompt-sub">PNG, JPG up to 10 MB</span>
          </div>
          <input type="file" name="image" id="vehicle-image" accept="image/*" class="upload-input" />
        </div>
      </div>

      <!-- Make / Model -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Make</label>
          <input type="text" name="make" placeholder="e.g. Mazda" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <input type="text" name="model" placeholder="e.g. 6" class="form-input" required />
        </div>
      </div>

      <!-- Year / Body type -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Year</label>
          <input type="number" name="year" placeholder="2024" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Body type</label>
          <select name="category" class="form-input">
            <option>Sedan</option><option>SUV</option><option>Hatchback</option>
            <option>Van</option><option>Pickup</option><option>Coupe</option>
          </select>
        </div>
      </div>

      <!-- Price / Horsepower -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Price / day ($)</label>
          <input type="number" name="price_per_day" placeholder="22.99" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Horsepower</label>
          <input type="number" name="horsepower" placeholder="250" class="form-input" />
        </div>
      </div>

      <!-- Transmission / Drive -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Transmission</label>
          <select name="transmission" class="form-input">
            <option value="Automatic">Automatic</option>
            <option value="Manual">Manual</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Drive</label>
          <select name="drive_type" class="form-input">
            <option value="AWD">AWD</option><option value="FWD">FWD</option>
            <option value="RWD">RWD</option><option value="4WD">4WD</option>
          </select>
        </div>
      </div>

      <!-- Spec line -->
      <div class="form-group">
        <label class="form-label">Spec line</label>
        <input type="text" name="spec_line" placeholder="e.g. 2.5 Turbo Premium" class="form-input" />
      </div>

      <!-- Seats / Penalty -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Seats</label>
          <input type="number" name="seats" placeholder="5" min="1" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Penalty rate ($/day)</label>
          <input type="number" name="penalty_rate" placeholder="0.00" min="0" step="0.01" class="form-input" required />
        </div>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" placeholder="e.g. well-maintained, no scratches…"
                  rows="3" class="form-textarea"></textarea>
      </div>

      <!-- Actions -->
      <div class="modal-actions">
        <button type="button"
                onclick="document.getElementById('add-vehicle-modal').close()"
                class="btn-cancel">Cancel</button>
        <button type="submit" id="vehicle-submit-btn" class="btn-submit">Add vehicle</button>
      </div>
    </form>
  </dialog>

  <script src="../../assets/js/api.js"></script>
  <script src="../../js/pages/admin-fleet.js"></script>
</body>
</html>
