<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CRMS - Vehicle details</title>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components/admin-fleet.css">
  <link rel="stylesheet" href="../../assets/css/components/admin-car-detail.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-topbar">
      <a class="admin-brand" href="./dashboard.html" aria-label="Auto Ultimate admin">
        <span class="admin-brand-mark">
          <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
        <span class="admin-brand-text">Auto<br>Ultimate</span>
      </a>
      <span class="admin-section-label">Admin</span>
      <nav class="admin-nav" data-admin-nav aria-label="Admin navigation"></nav>
      <div class="admin-topbar-actions">
        <button class="admin-icon-btn" data-admin-menu type="button" aria-label="Toggle navigation">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="admin-btn" data-logout type="button">Logout</button>
        <span class="admin-avatar">AD</span>
      </div>
    </header>

    <main class="detail-page">
      <a href="./fleet.html" class="btn-back">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Back to fleet
      </a>

      <!-- Hero section -->
      <section id="vehicle-detail" class="detail-hero">
        <div class="detail-media">
          <div class="detail-media-placeholder" id="detail-placeholder">
            <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.2">
              <rect x="1" y="6" width="22" height="13" rx="2"/>
              <path d="M5 6l2-3h10l2 3"/>
              <circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/>
            </svg>
            <span>No image uploaded</span>
          </div>
          <img id="detail-image" src="" alt="Vehicle image" style="display:none">
        </div>

        <div class="detail-meta">
          <div class="detail-meta-top">
            <div>
              <h1 id="detail-title">Vehicle</h1>
              <p id="detail-subtitle">—</p>
            </div>
            <div id="detail-status"></div>
          </div>

          <div class="detail-spec-strip" id="detail-spec-strip">
            <!-- year · category · id chips populated by JS -->
          </div>

          <div class="detail-actions">
            <button id="detail-edit-btn" class="btn-card-primary">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
            <button id="detail-delete-btn" class="btn-delete">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
              Delete
            </button>
          </div>
        </div>
      </section>

      <!-- Stats grid -->
      <section class="detail-grid" id="detail-grid">
        <!-- populated by JS -->
      </section>

      <!-- Description -->
      <div class="detail-description" id="detail-description-wrap" style="display:none">
        <p class="detail-section-label">Description</p>
        <p id="detail-description"></p>
      </div>

      <!-- Attribute chips -->
      <div class="attributes" id="detail-attributes"></div>

      <!-- Footer -->
      <div class="detail-footer">
        <small id="detail-added">&nbsp;</small>
        <button id="change-status-btn" class="btn-card-outline">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Change status
        </button>
      </div>
    </main>

    <!-- Edit modal -->
    <dialog id="car-edit-modal">
      <div class="modal-header">
        <h2 id="car-edit-title">Edit vehicle</h2>
        <button type="button" id="car-edit-close" class="modal-close-btn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="car-edit-form" novalidate>
        <input type="hidden" id="car-edit-id" name="id" value="">

        <!-- Image upload -->
        <div class="form-group">
          <label class="form-label">Vehicle image</label>
          <div class="upload-area" id="car-upload-area">
            <div id="car-image-preview-area" style="display:none">
              <img id="car-image-preview" class="upload-preview" alt="Preview">
              <button type="button" id="car-change-image-btn" class="btn-change-image">Change image</button>
            </div>
            <div id="car-image-upload-prompt" class="upload-prompt">
              <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" fill="none" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
              <span class="upload-prompt-title">Click to upload or drag and drop</span>
              <span class="upload-prompt-sub">PNG, JPG up to 10 MB</span>
            </div>
            <input type="file" name="image" id="car-image" accept="image/*" class="upload-input">
          </div>
        </div>

        <!-- Make / Model -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-make">Make</label>
            <input type="text" id="edit-make" name="make" placeholder="e.g. Mazda" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-model">Model</label>
            <input type="text" id="edit-model" name="model" placeholder="e.g. 6" class="form-input" required>
          </div>
        </div>

        <!-- Year / Body type -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-year">Year</label>
            <input type="number" id="edit-year" name="year" placeholder="2024" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-category">Body type</label>
            <select id="edit-category" name="category" class="form-input">
              <option>Sedan</option><option>SUV</option><option>Hatchback</option>
              <option>Van</option><option>Pickup</option><option>Coupe</option>
            </select>
          </div>
        </div>

        <!-- Price / Horsepower -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-price">Price / day ($)</label>
            <input type="number" id="edit-price" name="price_per_day" placeholder="22.99" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-hp">Horsepower</label>
            <input type="number" id="edit-hp" name="horsepower" placeholder="250" class="form-input">
          </div>
        </div>

        <!-- Transmission / Drive -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-transmission">Transmission</label>
            <select id="edit-transmission" name="transmission" class="form-input">
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-drive">Drive</label>
            <select id="edit-drive" name="drive_type" class="form-input">
              <option value="AWD">AWD</option><option value="FWD">FWD</option>
              <option value="RWD">RWD</option><option value="4WD">4WD</option>
            </select>
          </div>
        </div>

        <!-- Spec line -->
        <div class="form-group">
          <label class="form-label" for="edit-spec">Spec line</label>
          <input type="text" id="edit-spec" name="spec_line" placeholder="e.g. 2.5 Turbo Premium" class="form-input">
        </div>

        <!-- Seats / Penalty -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="edit-seats">Seats</label>
            <input type="number" id="edit-seats" name="seats" placeholder="5" min="1" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-penalty">Penalty rate ($/day)</label>
            <input type="number" id="edit-penalty" name="penalty_rate" placeholder="0.00" min="0" step="0.01" class="form-input" required>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label class="form-label" for="edit-description">Description</label>
          <textarea id="edit-description" name="description" placeholder="e.g. well-maintained, no scratches…" rows="3" class="form-textarea"></textarea>
        </div>

        <!-- Actions -->
        <div class="modal-actions">
          <button type="button" id="car-edit-cancel" class="btn-cancel">Cancel</button>
          <button type="submit" id="car-edit-submit" class="btn-submit">Save changes</button>
        </div>
      </form>
    </dialog>

    <!-- Confirm modal -->
    <dialog id="car-confirm-modal" class="confirm-modal">
      <div class="confirm-modal-shell">
        <div class="confirm-modal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
          </svg>
        </div>
        <div class="confirm-modal-content">
          <h3 id="car-confirm-title">Confirm action</h3>
          <p id="car-confirm-message">Are you sure?</p>
        </div>
        <div class="confirm-modal-actions">
          <button type="button" id="car-confirm-cancel" class="btn-cancel">Cancel</button>
          <button type="button" id="car-confirm-ok" class="btn-submit">Continue</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../js/pages/admin-car-detail.js"></script>
</body>
</html>
