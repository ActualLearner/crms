services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crms
      MYSQL_USER: crms_user
      MYSQL_PASSWORD: crms_password
    volumes:
      - crms_db:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: crms-api/Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    environment:
      APP_ENV: production
      ALLOWED_ORIGIN: http://localhost:8080
      DB_HOST: db
      DB_NAME: crms
      DB_USER: crms_user
      DB_PASS: crms_password
      RATE_LIMIT: 5
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHAPA_BASE_URL: ${CHAPA_BASE_URL:-https://api.chapa.co}
      CHAPA_SECRET_KEY: ${CHAPA_SECRET_KEY:-}
      CHAPA_WEBHOOK_SECRET: ${CHAPA_WEBHOOK_SECRET:-}
      CHAPA_CURRENCY: ${CHAPA_CURRENCY:-USD}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080/api}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    volumes:
      - crms_uploads:/var/www/html/public/uploads

  frontend:
    build:
      context: .
      dockerfile: crms-frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./crms-frontend:/usr/share/nginx/html:ro

volumes:
  crms_db:
  crms_uploads: